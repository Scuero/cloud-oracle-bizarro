<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Uncensored Cloud Oracle 🔮</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: #090a0f; color: #00ff66; 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 15px; overflow: hidden;
        }
        .arcade-container { 
            background: #12131c; border: 2px solid #00ff66; border-radius: 12px; 
            width: 100%; max-width: 650px; padding: 25px; 
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2); text-align: center;
        }
        h1 { font-size: 1.7rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; color: #fff; text-shadow: 0 0 8px #00ff66; }
        label { display: block; font-size: 0.8rem; margin: 10px 0 4px; text-align: left; color: #8892b0; font-weight: bold; }
        input, select { 
            width: 100%; padding: 10px; margin-bottom: 10px; 
            background: #090a0f; border: 1px solid #333; color: #fff; 
            font-family: inherit; border-radius: 4px; text-align: center; font-size: 0.9rem;
        }
        input:focus, select:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 5px rgba(0,255,102,0.5); }
        button { 
            width: 100%; padding: 12px; background: #00ff66; color: #000; 
            font-weight: bold; border: none; border-radius: 4px; cursor: pointer; 
            text-transform: uppercase; margin-top: 10px; font-size: 1rem; letter-spacing: 1px;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; transition: 0.2s; }
        
        /* Pantalla de resultados estilo 'Glitch/Alerta' */
        .result-screen { 
            background: #1c0d12; border: 1px dashed #ff0055; color: #ff0055;
            padding: 15px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; 
            line-height: 1.5; text-shadow: 0 0 4px rgba(255,0,85,0.3);
            text-align: left;
        }
        .footer { font-size: 0.7rem; color: #444; margin-top: 15px; line-height: 1.3; }
    </style>
</head>
<body>

    <div class="arcade-container">
        <h1>🔮 CLOUD ORACLE</h1>

        {% if resultado %}
            <div class="result-screen">
                <strong>[!] DICTAMEN PARA {{ resultado.nombre | upper }}:</strong><br>
                {{ resultado.mensaje }}
            </div>
        {% endif %}

        <form action="/oracle" method="post">
            <label>👾 TU NOMBRE / ALIAS:</label>
            <input type="text" name="nombre" placeholder="Introduce tu ID de humano" required value="{{ resultado.nombre if resultado else '' }}">

            <label>🎰 NÚMERO DE LA SUERTE:</label>
            <input type="number" name="numero" min="1" max="999" placeholder="Cualquier número entre 1 y 999" required>

            <label>🎨 COLOR DE TU ALMA:</label>
            <select name="color" required>
                <option value="Verde">Verde Tóxico 🧪</option>
                <option value="Azul">Azul Depresión 🌊</option>
                <option value="Rojo">Rojo Psicópata 🔥</option>
            </select>

            <button type="submit">Consultar Destino</button>
        </form>

        <div class="footer">
            <span>Infraestructura activa en streaming ➔ GCP</span>
        </div>
    </div>

</body>
</html>
